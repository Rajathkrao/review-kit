name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: JSON manifests parse
        run: |
          for f in .claude-plugin/*.json skills/review-kit/assets/*.json evals/answer-keys.json; do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done
      - name: Scripts compile
        run: |
          python -m py_compile skills/review-kit/scripts/*.py evals/score.py
          bash -n skills/review-kit/scripts/codex_review.sh
          bash -n evals/run_case.sh
      - name: Regression tests and metadata validation
        run: |
          python -m pip install -r tests/requirements.txt
          python tests/check_frontmatter.py
          python -m unittest discover -s tests -v
      - name: Collector and test detector run on fixtures
        run: |
          mkdir -p /tmp/fx && tar xzf evals/fixtures.tgz -C /tmp/fx
          cd /tmp/fx/ts-invoices && git checkout -q feature/invoice-export
          P=$(python "$GITHUB_WORKSPACE/skills/review-kit/scripts/collect.py" | tail -1)
          test -s "$P/diff-numbered.txt"
          grep -q "0007-invoice-csv-export" "$P/summary.md"
          case "$P" in */ts-invoices/.review-kit/runs/*) ;; *) echo "run folder not in repo: $P"; exit 1;; esac
          test -z "$(git status --porcelain --untracked-files=all)"
          python "$GITHUB_WORKSPACE/skills/review-kit/scripts/state.py" "$P" contract --note ci
          python "$GITHUB_WORKSPACE/skills/review-kit/scripts/state.py" --list . | grep -q "next=lenses"
          python "$GITHUB_WORKSPACE/skills/review-kit/scripts/detect_tests.py" "$P" > /dev/null
          cd /tmp/fx/cs-orders && git checkout -q feature/cancel-order
          P=$(python "$GITHUB_WORKSPACE/skills/review-kit/scripts/collect.py" | tail -1)
          grep -q "0012-order-cancellation" "$P/summary.md"
