name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Plugin changes bump the version (installed copies only update on a new version)
        if: github.event_name == 'pull_request'
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(skills|commands|agents)/|^\.claude-plugin/'; then
            old=$(git show "$BASE:.claude-plugin/plugin.json" | python -c "import json,sys; print(json.load(sys.stdin)['version'])")
            new=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
            if [ "$old" = "$new" ]; then
              echo "::error::Plugin files changed but version is still $old. Bump it in .claude-plugin/plugin.json and add a CHANGELOG.md entry."
              exit 1
            fi
            grep -q "^## $new " CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $new"; exit 1; }
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: JSON manifests parse
        run: |
          for f in .claude-plugin/*.json skills/review-kit/assets/*.json evals/answer-keys.json; do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done
      - name: Scripts compile
        run: |
          python -m py_compile skills/review-kit/scripts/*.py evals/score.py evals/build_hard_fixtures.py evals/check_keys.py evals/build_refine_fixture.py evals/build_walkthrough_demo.py evals/build_walkthrough_large.py
          bash -n skills/review-kit/scripts/codex_review.sh
          bash -n evals/run_case.sh
          bash -n evals/run_adversarial_baseline.sh
          bash -n evals/run_hard.sh
      - name: Regression tests and metadata validation
        run: |
          python -m pip install -r tests/requirements.txt
          python tests/check_frontmatter.py
          python -m unittest discover -s tests -v
      - name: Collector runs on fixtures and writes nothing in the repo
        run: |
          mkdir -p /tmp/fx && tar xzf evals/fixtures.tgz -C /tmp/fx
          cd /tmp/fx/ts-invoices && git checkout -q feature/invoice-export
          python "$GITHUB_WORKSPACE/skills/review-kit/scripts/collect.py" --base main > /tmp/ctx.txt
          P=$(tail -1 /tmp/ctx.txt | sed 's/^PKG=//')
          test -s "$P/diff-numbered.txt"
          grep -q "0007-invoice-csv-export" /tmp/ctx.txt
          grep -q "## Numbered diff" /tmp/ctx.txt
          test -z "$(git status --porcelain --untracked-files=all)"
          python "$GITHUB_WORKSPACE/skills/review-kit/scripts/detect_tests.py" "$P" > /dev/null
          cd /tmp/fx/cs-orders && git checkout -q feature/cancel-order
          python "$GITHUB_WORKSPACE/skills/review-kit/scripts/collect.py" --base main | grep -q "0012-order-cancellation"
      - name: Refine fixture builds, its tests pass, the structure map finds what was planted
        run: |
          python evals/build_refine_fixture.py /tmp/refine
          cd /tmp/refine/py-notify && python -m unittest -q
          python "$GITHUB_WORKSPACE/skills/review-kit/scripts/collect.py" --mode refine --whole --target notify > /tmp/ctx-refine.txt
          grep -q "16 special cases" /tmp/ctx-refine.txt
          grep -q "dispatch() only forwards its arguments to send()" /tmp/ctx-refine.txt
          grep -q "notify/service.py and notify/settings.py: together in 4" /tmp/ctx-refine.txt
          P=$(tail -1 /tmp/ctx-refine.txt | sed 's/^PKG=//')
          python "$GITHUB_WORKSPACE/skills/review-kit/scripts/refine_map.py" --compare "$P/refine-before.json" | grep -q "| Special cases | 16 | 16 | same |"
          test -z "$(git status --porcelain --untracked-files=all | grep -v __pycache__)"
      - name: Harder eval set builds, answer keys line up, collector handles a too-large diff
        run: |
          python evals/build_hard_fixtures.py /tmp/hard
          python evals/check_keys.py /tmp/hard
          cd /tmp/hard/py-ledger && git checkout -q feature/multi-currency
          python "$GITHUB_WORKSPACE/skills/review-kit/scripts/collect.py" --base main > /tmp/ctx-hard.txt
          P=$(tail -1 /tmp/ctx-hard.txt | sed 's/^PKG=//')
          grep -q "(too-large)" /tmp/ctx-hard.txt
          grep -q "0003-multi-currency" /tmp/ctx-hard.txt
          test -s "$P/diff-numbered.txt"
          test -z "$(git status --porcelain --untracked-files=all)"
