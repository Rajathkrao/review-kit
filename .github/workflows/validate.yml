name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: JSON manifests parse
        run: |
          for f in .claude-plugin/*.json skills/review-kit/assets/*.json evals/answer-keys.json; do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done
      - name: Scripts compile
        run: |
          python -m py_compile skills/review-kit/scripts/*.py evals/score.py evals/build_hard_fixtures.py evals/check_keys.py
          bash -n skills/review-kit/scripts/codex_review.sh
          bash -n evals/run_case.sh
          bash -n evals/run_adversarial_baseline.sh
          bash -n evals/run_hard.sh
      - name: Regression tests and metadata validation
        run: |
          python -m pip install -r tests/requirements.txt
          python tests/check_frontmatter.py
          python -m unittest discover -s tests -v
      - name: Collector runs on fixtures and writes nothing in the repo
        run: |
          mkdir -p /tmp/fx && tar xzf evals/fixtures.tgz -C /tmp/fx
          cd /tmp/fx/ts-invoices && git checkout -q feature/invoice-export
          python "$GITHUB_WORKSPACE/skills/review-kit/scripts/collect.py" --base main > /tmp/ctx.txt
          P=$(tail -1 /tmp/ctx.txt | sed 's/^PKG=//')
          test -s "$P/diff-numbered.txt"
          grep -q "0007-invoice-csv-export" /tmp/ctx.txt
          grep -q "## Numbered diff" /tmp/ctx.txt
          test -z "$(git status --porcelain --untracked-files=all)"
          python "$GITHUB_WORKSPACE/skills/review-kit/scripts/detect_tests.py" "$P" > /dev/null
          cd /tmp/fx/cs-orders && git checkout -q feature/cancel-order
          python "$GITHUB_WORKSPACE/skills/review-kit/scripts/collect.py" --base main | grep -q "0012-order-cancellation"
      - name: Harder eval set builds, answer keys line up, collector handles a too-large diff
        run: |
          python evals/build_hard_fixtures.py /tmp/hard
          python evals/check_keys.py /tmp/hard
          cd /tmp/hard/py-ledger && git checkout -q feature/multi-currency
          python "$GITHUB_WORKSPACE/skills/review-kit/scripts/collect.py" --base main > /tmp/ctx-hard.txt
          P=$(tail -1 /tmp/ctx-hard.txt | sed 's/^PKG=//')
          grep -q "(too-large)" /tmp/ctx-hard.txt
          grep -q "0003-multi-currency" /tmp/ctx-hard.txt
          test -s "$P/diff-numbered.txt"
          test -z "$(git status --porcelain --untracked-files=all)"
