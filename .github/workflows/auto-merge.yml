name: auto-merge
# Turns on GitHub auto-merge for every PR. The PR still merges only when branch protection
# is satisfied: the `validate` check passes and the code owner approves.
# Uses pull_request_target so it works for forks; it never checks out or runs PR code.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  enable:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "$PR" --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
