name: auto-merge
# Turns on GitHub auto-merge for PRs, so an approved PR with a green `validate` check merges by
# itself. Intended to run with branch protection on `main` (required `validate` check + Code Owner
# review); GitHub then holds the PR until both are satisfied.
#
# Guard: approval/BLOCKED alone do not prove CI and review are required. Verify both
# branch-protection gates; an unavailable protection lookup fails closed.
# Uses pull_request_target so it works for forks; it never checks out or runs PR code.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  enable:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge only behind required CI and review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          ENCODED_BASE=$(jq -rn --arg base "$BASE" '$base | @uri')
          if ! PROTECTION=$(gh api "repos/$REPO/branches/$ENCODED_BASE/protection"); then
            echo "::warning::Cannot verify branch protection; not enabling auto-merge."
            exit 0
          fi
          if ! jq -e '
            (.required_pull_request_reviews.required_approving_review_count // 0) >= 1 and
            (([.required_status_checks.contexts[]?] +
              [.required_status_checks.checks[]?.context]) | index("validate") != null)
          ' <<< "$PROTECTION" >/dev/null; then
            echo "::warning::Both required validate and required review must be configured; not enabling auto-merge."
            exit 0
          fi
          gh pr merge --auto --squash "$PR" --repo "$REPO" --match-head-commit "$HEAD"
